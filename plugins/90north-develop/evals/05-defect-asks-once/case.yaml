schema_version: "1.0"
name: 05-defect-asks-once
description: Two defects on the board, one clear and one with nothing to reproduce — the sweep triages both, then asks everything once, before it reproduces or fixes anything.
tags: [n-defect-loop, decision-round, questions]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep, Task, Agent]
  prompt: |
    Use the n-defect-loop skill of the 90north-develop plugin: sweep the defects on this repo's board. I am at the
    keyboard and will answer your questions.
runs: 3
graders:
  - type: regex
    name: nothing-fixed-before-the-answer
    target: {source: file, path: src/price.js}
    pattern: 'toFixed\(1\)'
  - type: regex
    name: nothing-isolated-before-the-answer
    target: trace
    pattern: 'git worktree add'
    match: not_contains
  - type: regex
    name: asks-about-the-push
    target: last_message
    pattern: '[Pp]ush'
  - type: llm
    name: one-round-for-the-whole-sweep
    criteria: >-
      The final message is one question round for the whole sweep, asked before any defect is reproduced or fixed:
      it asks whether the fix branch for TASK-2 (fix/TASK-2-…) may be pushed and its pull request opened once
      verified, with a recommended answer, and anything else it needs to ask is in the same message. It does not say
      a fix is already made.
  - type: llm
    name: the-vague-card-is-not-guessed
    criteria: >-
      TASK-3 ("Totals look wrong sometimes") is treated as missing information: the agent either wrote a comment on
      its card asking for the steps and the expected result, or asks for them in the same single question round. It
      does not invent a cause or a fix for TASK-3.
  - type: tool_used
    name: loop-fired
    tool: Skill
